name: Android debug APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Run native ISO parser tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -Iapp/src/main/cpp \
            tests/iso9660_test.cpp app/src/main/cpp/iso9660.cpp app/src/main/cpp/ps2_elf.cpp \
            -o /tmp/tmb_iso_test
          /tmp/tmb_iso_test
          g++ -std=c++17 -Wall -Wextra -Werror \
            -Iapp/src/main/cpp \
            tests/ps2_elf_test.cpp app/src/main/cpp/ps2_elf.cpp \
            -o /tmp/tmb_ps2_elf_test
          /tmp/tmb_ps2_elf_test
          g++ -std=c++17 -Wall -Wextra -Werror \
            -Iapp/src/main/cpp \
            tests/ps2_memory_test.cpp app/src/main/cpp/ps2_memory.cpp app/src/main/cpp/ps2_elf.cpp \
            -o /tmp/tmb_ps2_memory_test
          /tmp/tmb_ps2_memory_test

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-35" \
            "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Assemble debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tmb-native-port-lab-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
